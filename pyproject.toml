[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "statement-scrub"
version = "0.1.0a1"
description = "Local reviewed PDF anonymisation with synthetic financial data"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = ["pypdfium2==5.14.0", "reportlab==5.1.0", "pypdf==7.1.0", "streamlit==1.50.0", "python-stdnum==2.1", "PyMuPDF==2.1", "phonenumbers==9.0.43", "streamlit-image-coordinates==0.4.1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2"]

[project.scripts]
statement-scrub = "statement_scrub.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
